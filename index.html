<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beard-Bouncers</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: #000000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #box-container {
            position: relative;
            width: 95vmin;
            height: 95vmin;
            /* Changed border to outline to prevent collision misalignments */
            outline: 4px solid #ffffff;
            overflow: hidden;
        }
        #george {
            position: absolute;
            top: 0;
            left: 0;
            width: 15vmin; 
            height: auto;
            user-select: none;
            will-change: transform;
        }
    </style>
</head>
<body>

    <div id="box-container">
        <img id="george" src="George.png" alt="George">
    </div>

    <script>
        const img = document.getElementById('george');
        const container = document.getElementById('box-container');

        let posX = 0;
        let posY = 0;
        let speedX = 3;
        let speedY = 3;

        if (Math.random() > 0.5) speedX *= -1;
        if (Math.random() > 0.5) speedY *= -1;

        function initPosition() {
            const limitX = container.clientWidth - img.clientWidth;
            const limitY = container.clientHeight - img.clientHeight;
            posX = Math.random() * Math.max(0, limitX);
            posY = Math.random() * Math.max(0, limitY);
        }

        function updatePosition() {
            const imgWidth = img.clientWidth;
            const imgHeight = img.clientHeight;
            const boxWidth = container.clientWidth;
            const boxHeight = container.clientHeight;

            posX += speedX;
            posY += speedY;

            if (posX <= 0) {
                posX = 0;
                speedX = Math.abs(speedX);
            } else if (posX + imgWidth >= boxWidth) {
                posX = boxWidth - imgWidth;
                speedX = -Math.abs(speedX);
            }

            if (posY <= 0) {
                posY = 0;
                speedY = Math.abs(speedY);
            } else if (posY + imgHeight >= boxHeight) {
                posY = boxHeight - imgHeight;
                speedY = -Math.abs(speedY);
            }

            img.style.transform = `translate(${posX}px, ${posY}px)`;
            requestAnimationFrame(updatePosition);
        }

        function startAnimation() {
            initPosition();
            requestAnimationFrame(updatePosition);
        }

        img.addEventListener('load', startAnimation);
        if (img.complete) {
            startAnimation();
        }

        window.addEventListener('resize', () => {
            const maxW = container.clientWidth - img.clientWidth;
            const maxH = container.clientHeight - img.clientHeight;
            if (posX > maxW) posX = Math.max(0, maxW);
            if (posY > maxH) posY = Math.max(0, maxH);
        });
    </script>
</body>
</html>
