<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>George DVD Screensaver</title>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #george {
            position: absolute;
            width: 200px; /* Adjust size as needed */
            height: auto;
            user-select: none;
            will-change: transform;
        }
    </style>
</head>
<body>

    <img id="george" src="George.png" alt="George">

    <script>
        const img = document.getElementById('george');
        
        // Initial position
        let posX = Math.random() * (window.innerWidth - 200);
        let posY = Math.random() * (window.innerHeight - 200);
        
        // Speed and direction vectors
        let speedX = 3;
        let speedY = 3;

        // Apply random initial directions
        if (Math.random() > 0.5) speedX *= -1;
        if (Math.random() > 0.5) speedY *= -1;

        function updatePosition() {
            // Get current dimensions dynamically
            const imgWidth = img.clientWidth;
            const imgHeight = img.clientHeight;
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            // Move the image
            posX += speedX;
            posY += speedY;

            // Bounce off left/right walls
            if (posX <= 0) {
                posX = 0;
                speedX = Math.abs(speedX);
            } else if (posX + imgWidth >= screenWidth) {
                posX = screenWidth - imgWidth;
                speedX = -Math.abs(speedX);
            }

            // Bounce off top/bottom walls
            if (posY <= 0) {
                posY = 0;
                speedY = Math.abs(speedY);
            } else if (posY + imgHeight >= screenHeight) {
                posY = screenHeight - imgHeight;
                speedY = -Math.abs(speedY);
            }

            // Render position using transform for optimal performance
            img.style.transform = `translate(${posX}px, ${posY}px)`;

            requestAnimationFrame(updatePosition);
        }

        // Wait for image load to capture accurate dimensions
        img.addEventListener('load', () => {
            requestAnimationFrame(updatePosition);
        });

        // Fallback execution if image fails or is cached
        if (img.complete) {
            requestAnimationFrame(updatePosition);
        }

        // Handle window resizing safely
        window.addEventListener('resize', () => {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            
            if (posX + img.clientWidth > screenWidth) {
                posX = screenWidth - img.clientWidth;
            }
            if (posY + img.clientHeight > screenHeight) {
                posY = screenHeight - img.clientHeight;
            }
        });
    </script>
</body>
</html>
